name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  SHFMT_VERSION: 3.14.1

jobs:
  check:
    name: Format and syntax
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install shfmt
        run: |
          curl -fsSL -o "$RUNNER_TEMP/shfmt" \
            "https://github.com/mvdan/sh/releases/download/v${SHFMT_VERSION}/shfmt_v${SHFMT_VERSION}_linux_amd64"
          chmod +x "$RUNNER_TEMP/shfmt"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - uses: pnpm/action-setup@v4
        with:
          version: 12.10.1

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm run format:check

      - name: Check shell syntax
        run: bash -n merge-firefox-history.sh

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 psmisc lsof

      - name: Run integration tests
        run: python3 -m unittest discover -s tests -v

  real-firefox:
    name: Real Firefox history
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - uses: browser-actions/setup-firefox@v1
        with:
          firefox-version: latest

      - uses: browser-actions/setup-geckodriver@v1

      - name: Install test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y sqlite3 psmisc lsof
          python -m pip install 'selenium==4.37.0'

      - name: Merge real Firefox history
        env:
          MFFH_REAL_FIREFOX: "1"
        run: python3 -m unittest discover -s tests -p test_real_firefox.py -v
